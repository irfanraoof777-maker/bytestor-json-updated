kind = "web"
previewPath = "/"
title = "Bytestor Website"
description = "Bytestor IT Services company website featuring pages for services (IT services, consulting, training), clients, news, and contact. Designed for businesses looking for IT solutions and consulting services."
version = "1.0.0"
id = "artifacts/bytestor-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21027

[services.development]
run = "pnpm --filter @workspace/bytestor-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bytestor-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/bytestor-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21027"
BASE_PATH = "/"
